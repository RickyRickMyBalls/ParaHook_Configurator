site_name: ParaHook Docs
docs_dir: docs
site_url: https://rickyrickmyballs.github.io/ParaHook_Configurator/docs/

exclude_docs: |
  Archive/
  Human-Plans/CodexNotes/
  Human-Plans/roadmap/archive/
  Phase-Plans/Tasks/Archive/

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - navigation.top
    - navigation.tracking
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search

extra_css:
  - stylesheets/calendar.css

extra_javascript:
  - javascripts/calendar.js
